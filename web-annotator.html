<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Image Annotator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root { 
  --bg: #0b0b12;
  --surface: #12121c;
  --card: #181824;
  --border: #252538;
  --border2: #32324a;
  --accent: #4f8aff;
  --accent2: #a78bfa;
  --green: #34d399;
  --amber: #fbbf24;
  --red: #f87171;
  --text: #e4e4f0;
  --muted: #6868a0;
  --dim: #2e2e48;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: #fff;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
.logo span { color: var(--accent); }

.topbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  border-radius: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #6699ff; }
.btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--border2); background: var(--dim); }
.btn-danger { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.25); }
.btn-danger:hover { background: rgba(248,113,113,0.2); }
.btn-success { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
.btn-success:hover { background: rgba(52,211,153,0.2); }
.btn-amber { background: rgba(251,191,36,0.12); color: var(--amber); border: 1px solid rgba(251,191,36,0.25); }
.btn-amber:hover { background: rgba(251,191,36,0.2); }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.img-counter {
  font-size: 11px;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 6px;
  min-width: 90px;
  text-align: center;
}

/* ── MAIN LAYOUT ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── LEFT SIDEBAR ── */
.sidebar-left {
  width: 200px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-title {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

/* Label buttons */
.label-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  margin-bottom: 5px;
  transition: all 0.15s;
  text-align: left;
}
.label-btn:hover { background: var(--dim); }
.label-btn.active { background: var(--dim); border-color: var(--border2); }
.label-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.label-btn.active .label-dot { box-shadow: 0 0 8px currentColor; }

/* Thumbnail strip */
.thumb-strip {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.thumb-strip::-webkit-scrollbar { width: 3px; }
.thumb-strip::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.thumb-item {
  border-radius: 7px;
  border: 2px solid var(--border);
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: border-color 0.15s;
  aspect-ratio: 4/3;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
}
.thumb-item:hover { border-color: var(--border2); }
.thumb-item.active { border-color: var(--accent); }
.thumb-item img { width: 100%; height: 100%; object-fit: cover; }
.thumb-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  background: var(--green);
  color: #000;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
}
.thumb-num {
  position: absolute;
  bottom: 4px;
  left: 4px;
  background: rgba(0,0,0,0.7);
  color: var(--muted);
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
}
.thumb-empty { color: var(--muted); font-size: 10px; text-align: center; padding: 20px 10px; }

/* ── CANVAS AREA ── */
.canvas-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  overflow: hidden;
  position: relative;
}

.canvas-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 32px 32px;
  opacity: 0.2;
}

#canvas {
  position: relative;
  z-index: 1;
  cursor: crosshair;
  max-width: 100%;
  max-height: 100%;
  display: block;
  user-select: none;
}

/* Drop zone */
.dropzone {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.dropzone-box {
  border: 2px dashed var(--border2);
  border-radius: 20px;
  padding: 48px 64px;
  text-align: center;
  transition: border-color 0.2s, background 0.2s;
  cursor: pointer;
}
.dropzone-box:hover, .dropzone-box.drag-over {
  border-color: var(--accent);
  background: rgba(79,138,255,0.05);
}
.dropzone-icon { font-size: 48px; margin-bottom: 12px; }
.dropzone-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.dropzone-sub { font-size: 12px; color: var(--muted); }

/* ── RIGHT SIDEBAR ── */
.sidebar-right {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.anno-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.anno-list::-webkit-scrollbar { width: 3px; }
.anno-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.anno-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: border-color 0.15s;
}
.anno-item:hover { border-color: var(--border2); }
.anno-item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.anno-label-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
}
.anno-del {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  padding: 0 2px;
  line-height: 1;
  transition: color 0.15s;
}
.anno-del:hover { color: var(--red); }
.anno-coords { font-size: 10px; color: var(--muted); }

.no-anno { padding: 20px 12px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.6; }

/* Stats bar */
.stats-bar {
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stat-row { display: flex; justify-content: space-between; align-items: center; }
.stat-label { font-size: 10px; color: var(--muted); }
.stat-val { font-size: 12px; color: var(--text); }
.stat-val.green { color: var(--green); }
.stat-val.amber { color: var(--amber); }

/* ── STATUS BAR ── */
.statusbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 6px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s ease infinite; }
#status-msg { color: var(--text); }
.cursor-pos { margin-left: auto; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 13px;
  color: var(--text);
  opacity: 0;
  transition: all 0.3s;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(52,211,153,0.4); color: var(--green); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">Med<span>Annotate</span></div>
  <div class="topbar-sep"></div>
  <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
    ＋ Load Images
  </button>
  <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="loadFiles(this.files)">

  <button class="btn btn-ghost" onclick="prevImg()">◀ Prev</button>
  <button class="btn btn-ghost" onclick="nextImg()">Next ▶</button>
  <button class="btn btn-danger" onclick="clearBoxes()">✕ Clear</button>

  <div class="topbar-sep"></div>
  <button class="btn btn-success" onclick="saveJSON()">↓ Save JSON</button>
  <button class="btn btn-amber" onclick="saveCSV()">↓ Save CSV</button>

  <div class="topbar-right">
    <div class="img-counter" id="imgCounter">No images</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LEFT: Labels + Thumbnails -->
  <div class="sidebar-left">
    <div class="sidebar-section">
      <div class="sidebar-title">Label</div>
      <div id="labelBtns"></div>
    </div>
    <div class="sidebar-title" style="padding:10px 12px 0; font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted)">Images</div>
    <div class="thumb-strip" id="thumbStrip">
      <div class="thumb-empty">Load images to start</div>
    </div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-bg"></div>

    <div class="dropzone" id="dropzone">
      <div class="dropzone-box" id="dropBox"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="onDrop(event)"
           onclick="document.getElementById('fileInput').click()">
        <div class="dropzone-icon">🫁</div>
        <div class="dropzone-title">Drop X-Ray Images</div>
        <div class="dropzone-sub">or click to browse<br>PNG · JPG · BMP supported</div>
      </div>
    </div>

    <canvas id="canvas" style="display:none"></canvas>
  </div>

  <!-- RIGHT: Annotations -->
  <div class="sidebar-right">
    <div class="sidebar-section">
      <div class="sidebar-title">Annotations</div>
    </div>
    <div class="anno-list" id="annoList">
      <div class="no-anno">No annotations yet.<br>Draw a box on the image.</div>
    </div>
    <div class="stats-bar">
      <div class="stat-row">
        <span class="stat-label">Images annotated</span>
        <span class="stat-val green" id="statAnnotated">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Total boxes</span>
        <span class="stat-val amber" id="statBoxes">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Current image</span>
        <span class="stat-val" id="statCurrent">—</span>
      </div>
    </div>
  </div>

</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <div class="status-dot"></div>
  <span id="status-msg">Ready — load images to begin</span>
  <span class="cursor-pos" id="cursorPos">x: 0  y: 0</span>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const LABELS = [
  { name: 'Normal',       color: '#34d399' },
  { name: 'Pneumonia',    color: '#f87171' },
  { name: 'Effusion',     color: '#4f8aff' },
  { name: 'Nodule',       color: '#fbbf24' },
  { name: 'Cardiomegaly', color: '#a78bfa' },
  { name: 'Atelectasis',  color: '#fb923c' },
];

// ── STATE ───────────────────────────────────────────────
let images = [];          // {name, src, img}
let annotations = {};     // {name: [{label, color, x1,y1,x2,y2}]}
let currentIdx = -1;
let selectedLabel = LABELS[0];
let drawing = false;
let startX = 0, startY = 0;
let scaleX = 1, scaleY = 1;
let offX = 0, offY = 0;

const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');

// ── BUILD LABEL BUTTONS ─────────────────────────────────
function buildLabels() {
  const c = document.getElementById('labelBtns');
  LABELS.forEach((l, i) => {
    const btn = document.createElement('button');
    btn.className = 'label-btn' + (i === 0 ? ' active' : '');
    btn.innerHTML = `<span class="label-dot" style="background:${l.color}"></span>${l.name}`;
    btn.onclick = () => {
      document.querySelectorAll('.label-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedLabel = l;
    };
    c.appendChild(btn);
  });
}
buildLabels();

// ── FILE LOADING ────────────────────────────────────────
function loadFiles(files) {
  const arr = Array.from(files);
  if (!arr.length) return;
  document.getElementById('dropzone').style.display = 'none';
  canvas.style.display = 'block';

  let loaded = 0;
  arr.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const entry = { name: f.name, src: e.target.result, img };
        images.push(entry);
        if (!annotations[f.name]) annotations[f.name] = [];
        loaded++;
        if (loaded === arr.length) {
          buildThumbs();
          if (currentIdx < 0) showImage(0);
          toast('Loaded ' + loaded + ' image(s)', 'success');
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropBox').classList.remove('drag-over');
  loadFiles(e.dataTransfer.files);
}

// ── THUMBNAILS ──────────────────────────────────────────
function buildThumbs() {
  const strip = document.getElementById('thumbStrip');
  strip.innerHTML = '';
  images.forEach((im, i) => {
    const div = document.createElement('div');
    div.className = 'thumb-item' + (i === currentIdx ? ' active' : '');
    div.onclick = () => showImage(i);

    const img = document.createElement('img');
    img.src = im.src;
    div.appendChild(img);

    const num = document.createElement('div');
    num.className = 'thumb-num';
    num.textContent = i + 1;
    div.appendChild(num);

    div.id = 'thumb-' + i;
    strip.appendChild(div);
  });
  updateThumbBadges();
  document.getElementById('imgCounter').textContent = `${currentIdx + 1} / ${images.length}`;
}

function updateThumbBadges() {
  images.forEach((im, i) => {
    const div = document.getElementById('thumb-' + i);
    if (!div) return;
    const old = div.querySelector('.thumb-badge');
    if (old) old.remove();
    const count = (annotations[im.name] || []).length;
    if (count > 0) {
      const b = document.createElement('div');
      b.className = 'thumb-badge';
      b.textContent = count;
      div.appendChild(b);
    }
  });
}

// ── SHOW IMAGE ──────────────────────────────────────────
function showImage(idx) {
  if (idx < 0 || idx >= images.length) return;
  currentIdx = idx;

  // Update thumb highlights
  document.querySelectorAll('.thumb-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  const wrap = document.getElementById('canvasWrap');
  const maxW = wrap.clientWidth - 16;
  const maxH = wrap.clientHeight - 16;
  const im = images[idx].img;

  scaleX = Math.min(maxW / im.width, maxH / im.height);
  scaleY = scaleX;

  canvas.width  = Math.round(im.width  * scaleX);
  canvas.height = Math.round(im.height * scaleY);

  redraw();
  updateAnnoPanel();
  updateStats();
  document.getElementById('imgCounter').textContent = `${idx + 1} / ${images.length}`;
  setStatus('Editing: ' + images[idx].name);
}

function redraw() {
  if (currentIdx < 0) return;
  const im = images[currentIdx];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(im.img, 0, 0, canvas.width, canvas.height);

  const boxes = annotations[im.name] || [];
  boxes.forEach((b, i) => drawBox(b, i));
}

function drawBox(b, idx) {
  const x = b.x1 * scaleX, y = b.y1 * scaleY;
  const w = (b.x2 - b.x1) * scaleX, h = (b.y2 - b.y1) * scaleY;

  ctx.strokeStyle = b.color;
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  // Fill with transparent tint
  ctx.fillStyle = b.color + '22';
  ctx.fillRect(x, y, w, h);

  // Label chip
  const lbl = `${idx + 1}. ${b.label}`;
  ctx.font = 'bold 12px DM Mono, monospace';
  const tw = ctx.measureText(lbl).width + 14;
  const th = 20;
  const ly = y > th + 4 ? y - th - 2 : y + 2;

  ctx.fillStyle = b.color;
  roundRect(ctx, x, ly, tw, th, 4);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.fillText(lbl, x + 7, ly + 14);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── MOUSE DRAWING ────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  if (currentIdx < 0) return;
  drawing = true;
  const r = canvas.getBoundingClientRect();
  startX = e.clientX - r.left;
  startY = e.clientY - r.top;
});

canvas.addEventListener('mousemove', e => {
  if (currentIdx < 0) return;
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  document.getElementById('cursorPos').textContent =
    `x: ${Math.round(mx / scaleX)}  y: ${Math.round(my / scaleY)}`;

  if (!drawing) return;
  redraw();
  // Live preview box
  ctx.strokeStyle = selectedLabel.color;
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 3]);
  ctx.strokeRect(startX, startY, mx - startX, my - startY);
  ctx.setLineDash([]);
  ctx.fillStyle = selectedLabel.color + '18';
  ctx.fillRect(startX, startY, mx - startX, my - startY);
});

canvas.addEventListener('mouseup', e => {
  if (!drawing || currentIdx < 0) return;
  drawing = false;
  const r = canvas.getBoundingClientRect();
  const ex = e.clientX - r.left, ey = e.clientY - r.top;

  if (Math.abs(ex - startX) < 6 || Math.abs(ey - startY) < 6) { redraw(); return; }

  const x1 = Math.round(Math.min(startX, ex) / scaleX);
  const y1 = Math.round(Math.min(startY, ey) / scaleY);
  const x2 = Math.round(Math.max(startX, ex) / scaleX);
  const y2 = Math.round(Math.max(startY, ey) / scaleY);

  const name = images[currentIdx].name;
  annotations[name].push({ label: selectedLabel.name, color: selectedLabel.color, x1, y1, x2, y2 });

  redraw();
  updateAnnoPanel();
  updateThumbBadges();
  updateStats();
  setStatus(`Added: ${selectedLabel.name} [${x1},${y1},${x2},${y2}]`);
});

canvas.addEventListener('mouseleave', () => {
  if (drawing) { drawing = false; redraw(); }
});

// ── ANNOTATION PANEL ────────────────────────────────────
function updateAnnoPanel() {
  const list = document.getElementById('annoList');
  if (currentIdx < 0) { list.innerHTML = '<div class="no-anno">No image loaded.</div>'; return; }
  const name = images[currentIdx].name;
  const boxes = annotations[name] || [];
  if (!boxes.length) {
    list.innerHTML = '<div class="no-anno">No annotations yet.<br>Draw a box on the image.</div>';
    return;
  }
  list.innerHTML = '';
  boxes.forEach((b, i) => {
    const item = document.createElement('div');
    item.className = 'anno-item';
    item.innerHTML = `
      <div class="anno-item-top">
        <div class="anno-label-pill">
          <span style="width:8px;height:8px;border-radius:50%;background:${b.color};display:inline-block;flex-shrink:0"></span>
          <span style="font-size:12px">${b.label}</span>
        </div>
        <button class="anno-del" onclick="deleteBox(${i})" title="Delete">✕</button>
      </div>
      <div class="anno-coords">[${b.x1}, ${b.y1}] → [${b.x2}, ${b.y2}]</div>
    `;
    list.appendChild(item);
  });
}

function deleteBox(idx) {
  const name = images[currentIdx].name;
  annotations[name].splice(idx, 1);
  redraw();
  updateAnnoPanel();
  updateThumbBadges();
  updateStats();
}

function clearBoxes() {
  if (currentIdx < 0) return;
  const name = images[currentIdx].name;
  annotations[name] = [];
  redraw();
  updateAnnoPanel();
  updateThumbBadges();
  updateStats();
  toast('Cleared all boxes');
}

// ── NAVIGATION ──────────────────────────────────────────
function prevImg() { if (currentIdx > 0) showImage(currentIdx - 1); }
function nextImg() { if (currentIdx < images.length - 1) showImage(currentIdx + 1); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  prevImg();
  if (e.key === 'ArrowRight') nextImg();
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (document.activeElement === document.body) clearBoxes();
  }
});

// ── STATS ───────────────────────────────────────────────
function updateStats() {
  const annotated = Object.values(annotations).filter(v => v.length > 0).length;
  const total = Object.values(annotations).reduce((s, v) => s + v.length, 0);
  document.getElementById('statAnnotated').textContent = annotated;
  document.getElementById('statBoxes').textContent = total;
  document.getElementById('statCurrent').textContent =
    currentIdx >= 0 ? `${(annotations[images[currentIdx].name] || []).length} boxes` : '—';
}

// ── SAVE JSON ───────────────────────────────────────────
function saveJSON() {
  const output = {
    metadata: {
      project: 'CV Project — Week 1',
      dataset: 'NIH Chest X-Ray',
      tool: 'MedAnnotate Web Portal',
      created: new Date().toISOString(),
      total_images: images.length,
      total_boxes: Object.values(annotations).reduce((s, v) => s + v.length, 0)
    },
    annotations: images.map(im => ({
      image: im.name,
      boxes: (annotations[im.name] || []).map(b => ({
        label: b.label,
        bbox: [b.x1, b.y1, b.x2, b.y2]
      }))
    })).filter(a => a.boxes.length > 0)
  };
  download('annotations.json', JSON.stringify(output, null, 2), 'application/json');
  toast('Saved annotations.json ✓', 'success');
}

// ── SAVE CSV ────────────────────────────────────────────
function saveCSV() {
  let csv = 'image,label,x1,y1,x2,y2\n';
  images.forEach(im => {
    (annotations[im.name] || []).forEach(b => {
      csv += `${im.name},${b.label},${b.x1},${b.y1},${b.x2},${b.y2}\n`;
    });
  });
  download('annotations.csv', csv, 'text/csv');
  toast('Saved annotations.csv ✓', 'success');
}

function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  a.click();
}

// ── HELPERS ─────────────────────────────────────────────
function setStatus(msg) { document.getElementById('status-msg').textContent = msg; }

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.className = 'toast', 2500);
}

// Initial stats
updateStats();
</script>
</body>
</html>
